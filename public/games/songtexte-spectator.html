<style>
    .songtexte-spec { text-align: center; }
    .songtexte-spec-title { color: #a4b0be; font-size: 1.5rem; }
    .songtexte-spec-text { margin: 20px 0; font-size: clamp(1.8rem, 5vw, 3.6rem); line-height: 1.5; overflow-wrap: anywhere; }
    .songtexte-line { min-height: 1.5em; }
</style>

<section class="card songtexte-spec">
    <h2>Songtexte vervollständigen</h2>
    <div id="songtexteSpecTitle" class="songtexte-spec-title"></div>
    <div id="songtexteSpecText" class="songtexte-spec-text"></div>
</section>

<script>
    window.songtexteSpecRender = function(game) {
        const title = document.getElementById('songtexteSpecTitle');
        const text = document.getElementById('songtexteSpecText');
        if (!title || !text) return;
        title.textContent = game.phase === 'IDLE' ? 'Warte auf den nächsten Song...' : (game.part ? `${game.title} (${game.part})` : game.title);
        const lines = [];
        (game.revealed || []).forEach(word => {
            if (word.newLine || !lines.length) lines.push([]);
            lines[lines.length - 1].push(word.text);
        });
        if (game.phase === 'PLAYING') {
            if (!lines.length) lines.push([]);
            lines[lines.length - 1].push('…');
        }
        text.replaceChildren(...lines.map(line => {
            const div = document.createElement('div');
            div.className = 'songtexte-line';
            div.textContent = line.join(' ');
            return div;
        }));
    };

    window.onSpectatorStateUpdate = function(state) {
        window.songtexteSpecRender(state.songtexteGame || {});
    };
</script>
