<style>
    .bsalat-admin-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-end;
        margin-bottom: 14px;
    }
    .bsalat-admin-label {
        font-size: 0.85rem;
        color: #a4b0be;
        margin-bottom: 4px;
        display: block;
    }
    .bsalat-select, .bsalat-input {
        padding: 8px 12px;
        background: #1c202c;
        border: 1px solid #4a5676;
        border-radius: 6px;
        color: #fff;
        font-family: inherit;
        font-size: 0.95rem;
        min-width: 220px;
    }
    .bsalat-admin-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0;
    }
    .bsalat-admin-scores {
        margin-top: 16px;
    }
</style>

<div class="card">
    <h2>🔤 Buchstabensalat (Admin)</h2>
    
    <div class="bsalat-admin-row">
        <div>
            <label class="bsalat-admin-label">Runde wählen:</label>
            <select id="bsalatRoundSelect" class="bsalat-select">
                <option value="">-- Runde wählen --</option>
            </select>
        </div>
        <div>
            <label class="bsalat-admin-label">Sekunden pro Schritt:</label>
            <input id="bsalatDuration" type="number" class="bsalat-input" value="2" min="1" max="30" style="min-width:80px;" />
        </div>
    </div>
    
    <div class="bsalat-admin-actions">
        <button onclick="startBuchstabensalat()">▶ Runde starten</button>
        <button onclick="lockBuchstabensalatBuzzer()">🔒 Buzzer locken</button>
        <button onclick="revealBuchstabensalat()">👁 Aufdecken</button>
        <button onclick="resetBuchstabensalat()">↺ Zurücksetzen</button>
    </div>
    
    <div id="bsalatAdminScores" class="bsalat-admin-scores"></div>
    <div id="bsalatAdminWinner"></div>
    <div id="bsalatAdminStatus">Noch keine Runde aktiv.</div>
</div>

<script>
    var lastBuchstabensalatAdminBuzzerWinner = null;

    function playBuchstabensalatAdminBuzzerSound() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const context = new AudioContext();
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = 'square';
        oscillator.frequency.setValueAtTime(880, context.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(440, context.currentTime + 0.18);
        gain.gain.setValueAtTime(0.18, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.22);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start();
        oscillator.stop(context.currentTime + 0.22);
    }

    // Runde sofort beim Einfügen des Scripts in den Dropdown laden
    (function() {
        fetch('/buchstabensalat.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var sel = document.getElementById('bsalatRoundSelect');
                if (!sel) return;
                (data.rounds || []).forEach(function(r) {
                    var opt = document.createElement('option');
                    opt.value = r.id;
                    opt.textContent = r.category + ': ' + r.answer;
                    sel.appendChild(opt);
                });
            })
            .catch(function(e) {
                console.error('Buchstabensalat-Runden konnten nicht geladen werden:', e);
            });
    })();

    window.startBuchstabensalat = function() {
        var sel = document.getElementById('bsalatRoundSelect');
        var durationInput = document.getElementById('bsalatDuration');
        
        if (!sel || !durationInput) {
            console.error('Buchstabensalat-Elemente nicht gefunden');
            return;
        }
        
        var roundId = sel.value;
        if (!roundId) {
            alert('Bitte wähle zuerst eine Runde aus!');
            return;
        }
        
        var dur = parseInt(durationInput.value, 10) || 2;
        if (dur < 1) dur = 1;
        if (dur > 30) dur = 30;
        
        console.log('Sending adminStartBuchstabensalatRound:', roundId, dur);
        socket.emit('adminStartBuchstabensalatRound', { roundId: roundId, duration: dur });
    };

    window.lockBuchstabensalatBuzzer = function() {
        socket.emit('adminLockBuchstabensalatBuzzer');
    };

    window.revealBuchstabensalat = function() {
        socket.emit('adminRevealBuchstabensalat');
    };

    window.resetBuchstabensalat = function() {
        socket.emit('adminResetBuchstabensalat');
    };

    window.adminAddBuchstabensalatPoint = function(team, amount) {
        if (typeof socket !== 'undefined') {
            socket.emit('adminAddBuchstabensalatPoint', { team: team, amount: amount });
        }
    };

    window.onModuleStateUpdate = function(state) {
        var game = state.buchstabensalatGame || {};
        var scores = game.scores || {};
        var buzzerWinner = game.buzzerWinner;
        var buzzerLocked = game.buzzerLocked;
        var winner = game.winnerTeam;

        var statusEl = document.getElementById('bsalatAdminStatus');
        var scoresContainer = document.getElementById('bsalatAdminScores');
        var winnerEl = document.getElementById('bsalatAdminWinner');

        if (!statusEl || !scoresContainer || !winnerEl) return;

        if (buzzerWinner && buzzerWinner !== lastBuchstabensalatAdminBuzzerWinner) {
            playBuchstabensalatAdminBuzzerSound();
            lastBuchstabensalatAdminBuzzerWinner = buzzerWinner;
        }
        if (!buzzerWinner) lastBuchstabensalatAdminBuzzerWinner = null;

        if (game.category) {
            statusEl.innerText = 'Kategorie: ' + game.category + ' | Antwort: ' + (game.revealed || '— — —');
        } else {
            statusEl.innerText = buzzerLocked ? 'Buzzer ist gesperrt.' : 'Noch keine Runde aktiv.';
        }

        // Punktezähler anzeigen (wird bei jedem Update neu gerendert, genau wie bei anderen Spielen)
        if (scoresContainer && scores && typeof scores === 'object') {
            scoresContainer.innerHTML = '';
            Object.entries(scores).forEach(function(entry) {
                var team = entry[0];
                var points = entry[1] !== undefined && entry[1] !== null ? entry[1] : 0;
                var score = document.createElement('div');
                score.style.cssText = 'margin: 8px 0; display: flex; align-items: center; gap: 8px;';
                score.innerHTML = '<b>' + team + ': ' + points + ' / 5</b>' +
                    '<button onclick="adminAddBuchstabensalatPoint(\'' + team + '\', -1)">-1</button>' +
                    '<button onclick="adminAddBuchstabensalatPoint(\'' + team + '\', 1)">+1</button>';
                scoresContainer.appendChild(score);
            });
        }

        winnerEl.innerText = winner ? winner + ' gewinnt mit 5 Punkten.' : '';
    };
</script>
