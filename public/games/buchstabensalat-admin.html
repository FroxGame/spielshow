<div class="card">
    <h2>Buchstabensalat</h2>
    <label>Runde:</label>
    <select id="bsalatRoundSelect" style="width:100%; padding:8px; margin:5px 0 10px;"></select>
    <label>Sekunden pro Schritt:</label>
    <input id="bsalatStepSeconds" type="number" min="1" max="30" value="2" style="width:80px;">
    <div style="margin: 10px 0;">
        <button onclick="startBuchstabensalat()">Runde starten</button>
        <button onclick="revealBuchstabensalat()">Auflösen</button>
    </div>
    <p id="bsalatAdminStatus">Noch keine Runde aktiv.</p>
    <p>Lösung (nur für dich sichtbar): <b id="bsalatAdminSolution">-</b></p>
</div>

<script>
    let bsalatRounds = [];

    socket.off('receiveBuchstabensalatRounds');
    socket.on('receiveBuchstabensalatRounds', rounds => {
        bsalatRounds = rounds;
        const select = document.getElementById('bsalatRoundSelect');
        if (!select) return;
        select.replaceChildren(...rounds.map(round => {
            const option = document.createElement('option');
            option.value = round.id;
            option.textContent = `${round.answer} (${round.category})`;
            return option;
        }));
    });
    socket.emit('getBuchstabensalatRounds');

    window.startBuchstabensalat = function() {
        const roundId = document.getElementById('bsalatRoundSelect').value;
        if (!roundId) return alert('Bitte eine Runde wählen!');
        socket.emit('adminStartBuchstabensalatRound', {
            roundId,
            duration: Number(document.getElementById('bsalatStepSeconds').value) || 2
        });
    };
    window.revealBuchstabensalat = () => socket.emit('adminRevealBuchstabensalat');

    window.onModuleStateUpdate = function(state) {
        const game = state.buchstabensalatGame || {};
        const status = document.getElementById('bsalatAdminStatus');
        if (!status) return;
        const round = bsalatRounds.find(entry => entry.id === game.roundId);
        document.getElementById('bsalatAdminSolution').textContent = round ? round.answer : '-';
        status.textContent = game.phase === 'IDLE'
            ? 'Noch keine Runde aktiv.'
            : `${game.phase} | Schritt ${game.step} / ${game.totalSteps}`;
    };
</script>
