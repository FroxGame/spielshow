<style>
    .bsalat-game { text-align: center; }
    .bsalat-category { color: #a4b0be; margin-bottom: 8px; }
    .bsalat-word {
        min-height: 1.4em;
        margin: 14px 0;
        font-size: clamp(1.8rem, 7vw, 3.2rem);
        font-weight: bold;
        letter-spacing: 3px;
        color: #ffd166;
        overflow-wrap: anywhere;
    }
    .bsalat-word.is-solved { color: #2ed573; }
</style>

<div class="bsalat-game">
    <h2>Buchstabensalat</h2>
    <div id="bsalatCategory" class="bsalat-category"></div>
    <div id="bsalatWord" class="bsalat-word"></div>
    <div id="bsalatProgress" class="bsalat-category"></div>
</div>

<script>
    window.onModuleStateUpdate = function(state) {
        const game = state.buchstabensalatGame || {};
        const word = document.getElementById('bsalatWord');
        if (!word) return;
        const idle = game.phase === 'IDLE';
        document.getElementById('bsalatCategory').textContent = idle ? 'Warte auf die nächste Runde...' : `Kategorie: ${game.category}`;
        word.textContent = idle ? '' : (game.revealed || '…');
        word.classList.toggle('is-solved', game.phase === 'REVEALED');
        document.getElementById('bsalatProgress').textContent = game.phase === 'PLAYING' ? `Schritt ${game.step} von ${game.totalSteps}` : '';
    };
</script>
