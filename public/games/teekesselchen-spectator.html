<style>
    .tee-spec { text-align: center; }
    .tee-spec-timer { font-size: 3rem; font-weight: bold; }
    .tee-spec-team { margin: 12px auto; padding: 14px; max-width: 800px; border: 1px solid #566078; border-radius: 8px; text-align: left; }
    .tee-spec-answer { margin-top: 16px; font-size: 3rem; font-weight: bold; color: #2ed573; }
</style>

<section class="card tee-spec">
    <h2>Teekesselchen</h2>
    <p id="teeSpecStatus">Warte auf die nächste Runde...</p>
    <div id="teeSpecTimer" class="tee-spec-timer"></div>
    <div id="teeSpecTeams"></div>
    <div id="teeSpecAnswer" class="tee-spec-answer"></div>
</section>

<script>
    window.onSpectatorStateUpdate = function(state) {
        const game = state.teekesselchenGame || {};
        const teams = document.getElementById('teeSpecTeams');
        if (!teams) return;

        document.getElementById('teeSpecStatus').textContent = {
            IDLE: 'Warte auf die nächste Runde...',
            WRITING: 'Die Teams beschreiben ihr Wort...',
            GUESSING: 'Welches Wort ist gemeint?',
            REVEALED: 'Auflösung'
        }[game.phase] || '';
        document.getElementById('teeSpecTimer').textContent = game.phase === 'WRITING' ? `${game.timeRemaining}s` : '';

        teams.replaceChildren(...Object.entries(game.revealedTeams || {}).map(([team, info]) => {
            const box = document.createElement('div');
            box.className = 'tee-spec-team';
            const heading = document.createElement('b');
            heading.textContent = `${team}: ${info.category}`;
            box.appendChild(heading);
            info.texts.forEach(entry => {
                const line = document.createElement('div');
                line.textContent = `${entry.name}: ${entry.text}`;
                box.appendChild(line);
            });
            return box;
        }));
        document.getElementById('teeSpecAnswer').textContent = game.answer || '';
    };
</script>
