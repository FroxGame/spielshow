<style>
    .listenwissen-game {
        background: #1e1e28;
        padding: 16px;
        border-radius: 10px;
    }

    .listenwissen-game h2 {
        margin: 0 0 12px;
        font-size: 1.25rem;
    }

    #wordProgress {
        margin-bottom: 14px;
        font-size: 0.95rem;
        color: #a4b0be;
    }

    #playerWordBoard {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 680px;
        margin: 0 auto;
    }

    .listenwissen-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        width: 100%;
    }

    .listenwissen-row:nth-child(even) {
        width: calc(100% - 40px);
        margin-left: 20px;
    }

    .listenwissen-row.is-short {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 75%;
        align-self: center;
    }

    .listenwissen-word {
        min-height: 42px;
        padding: 7px 10px;
        border-radius: 5px;
        font-size: 0.95rem;
        line-height: 1.2;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
        #playerWordBoard {
            max-width: none;
        }

        .listenwissen-row,
        .listenwissen-row.is-short {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            width: 100%;
            margin-left: 0;
        }

        .listenwissen-word {
            min-height: 42px;
            font-size: 0.82rem;
            padding: 7px 5px;
        }
    }
</style>

<div class="listenwissen-game">
    <h2 id="wordTitle">Listenwissen</h2>
    <div id="wordProgress">Gefunden: 0 / 0</div>
    <div id="playerWordBoard"></div>
</div>

<script>
    window.onModuleStateUpdate = function(state) {
        const board = document.getElementById('playerWordBoard');
        const title = document.getElementById('wordTitle');
        const progress = document.getElementById('wordProgress');
        if (!board) return;

        const game = state.listenwissenGame || {};
        const words = game.wordGameData || [];
        title.textContent = game.currentWordListKey ? `Kategorie: ${game.currentWordListKey}` : 'Listenwissen';
        progress.textContent = `Gefunden: ${words.filter(item => item.revealed).length} / ${words.length}`;

        board.innerHTML = '';
        for (let index = 0; index < words.length; index += 4) {
            const rowItems = words.slice(index, index + 4);
            const row = document.createElement('div');
            row.className = `listenwissen-row${rowItems.length < 4 ? ' is-short' : ''}`;

            rowItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'listenwissen-word';
                card.style.background = item.revealed ? '#2ed573' : '#2c2c3a';
                card.style.color = item.revealed ? '#fff' : '#a4b0be';
                card.textContent = item.revealed ? item.word : '?';
                row.appendChild(card);
            });

            board.appendChild(row);
        }
    };
</script>
