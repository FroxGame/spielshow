<style>
    .bsalat-spec { text-align: center; }
    .bsalat-spec-category { color: #a4b0be; font-size: 1.3rem; }
    .bsalat-spec-word {
        min-height: 1.4em;
        margin: 24px 0;
        font-size: clamp(2.4rem, 9vw, 6rem);
        font-weight: bold;
        letter-spacing: 5px;
        color: #ffd166;
        overflow-wrap: anywhere;
    }
    .bsalat-spec-word.is-solved { color: #2ed573; }
</style>

<section class="card bsalat-spec">
    <h2>Buchstabensalat</h2>
    <div id="bsalatSpecCategory" class="bsalat-spec-category"></div>
    <div id="bsalatSpecWord" class="bsalat-spec-word"></div>
</section>

<script>
    window.onSpectatorStateUpdate = function(state) {
        const game = state.buchstabensalatGame || {};
        const word = document.getElementById('bsalatSpecWord');
        if (!word) return;
        const idle = game.phase === 'IDLE';
        document.getElementById('bsalatSpecCategory').textContent = idle ? 'Warte auf die nächste Runde...' : `Kategorie: ${game.category}`;
        word.textContent = idle ? '' : (game.revealed || '…');
        word.classList.toggle('is-solved', game.phase === 'REVEALED');
    };
</script>
