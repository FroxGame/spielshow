<div class="card">
    <h2>Teekesselchen</h2>
    <label>Runde:</label>
    <select id="teeRoundSelect" style="width:100%; padding:8px; margin:5px 0 10px;"></select>
    <label>Schreibzeit in Sekunden:</label>
    <input id="teeDuration" type="number" min="10" max="300" value="60" style="width:80px;">
    <div style="margin: 10px 0;">
        <button onclick="startTeekesselchen()">Runde starten</button>
        <button onclick="closeTeekesselchenInputs()">Textfelder schließen</button>
        <button onclick="revealTeekesselchen()">Wort auflösen</button>
    </div>
    <div id="teeRevealButtons" style="margin: 10px 0;"></div>
    <p id="teeAdminStatus">Noch keine Runde aktiv.</p>
    <p>Lösung (nur für dich sichtbar): <b id="teeAdminSolution">-</b></p>
</div>

<script>
    let teeRounds = [];

    socket.off('receiveTeekesselchenRounds');
    socket.on('receiveTeekesselchenRounds', rounds => {
        teeRounds = rounds;
        const select = document.getElementById('teeRoundSelect');
        if (!select) return;
        select.replaceChildren(...rounds.map(round => {
            const option = document.createElement('option');
            option.value = round.id;
            option.textContent = `${round.answer} (${round.category1} / ${round.category2})`;
            return option;
        }));
    });
    socket.emit('getTeekesselchenRounds');

    window.startTeekesselchen = function() {
        const roundId = document.getElementById('teeRoundSelect').value;
        if (!roundId) return alert('Bitte eine Runde wählen!');
        socket.emit('adminStartTeekesselchenRound', {
            roundId,
            duration: Number(document.getElementById('teeDuration').value) || 60
        });
    };
    window.closeTeekesselchenInputs = () => socket.emit('adminCloseTeekesselchenInputs');
    window.revealTeekesselchen = () => socket.emit('adminRevealTeekesselchen');

    window.onModuleStateUpdate = function(state) {
        const game = state.teekesselchenGame || {};
        const status = document.getElementById('teeAdminStatus');
        if (!status) return;

        const round = teeRounds.find(entry => entry.id === game.roundId);
        document.getElementById('teeAdminSolution').textContent = round ? round.answer : '-';
        status.textContent = game.phase === 'IDLE'
            ? 'Noch keine Runde aktiv.'
            : `${game.phase}${game.phase === 'WRITING' ? ` | noch ${game.timeRemaining}s` : ''}`;

        const buttons = document.getElementById('teeRevealButtons');
        buttons.replaceChildren(...Object.keys(state.teams).map(team => {
            const button = document.createElement('button');
            const revealed = Boolean(game.revealedTeams && game.revealedTeams[team]);
            button.textContent = revealed ? `${team}: gezeigt` : `${team}: Beschreibung zeigen`;
            button.disabled = game.phase === 'IDLE' || game.phase === 'WRITING';
            button.onclick = () => socket.emit('adminRevealTeekesselchenTeam', team);
            return button;
        }));
    };
</script>
