<div class="card">
    <h2>Teekesselchen</h2>
    <label>Runde:</label>
    <select id="teeRoundSelect" style="width:100%; padding:8px; margin:5px 0 10px;"></select>
    <div style="margin: 10px 0;">
        <button onclick="startTeekesselchen()">Runde starten</button>
        <button onclick="releaseTeekesselchenWords()">Wörter freigeben</button>
        <button onclick="revealTeekesselchen()">Wort auflösen</button>
    </div>
    <p id="teeAdminStatus">Noch keine Runde aktiv.</p>
    <p>Lösung (nur für dich sichtbar): <b id="teeAdminSolution">-</b></p>
    <div id="teeAdminOverview"></div>
</div>

<script>
    let teeRounds = [];

    socket.off('receiveTeekesselchenRounds');
    socket.on('receiveTeekesselchenRounds', rounds => {
        teeRounds = rounds;
        const select = document.getElementById('teeRoundSelect');
        if (!select) return;
        select.replaceChildren(...rounds.map(round => {
            const option = document.createElement('option');
            option.value = round.id;
            option.textContent = `${round.answer} (${round.category1} / ${round.category2})`;
            return option;
        }));
    });
    socket.emit('getTeekesselchenRounds');

    socket.off('teekesselchenOverview');
    socket.on('teekesselchenOverview', overview => {
        const box = document.getElementById('teeAdminOverview');
        if (!box) return;
        box.replaceChildren(...Object.entries(overview).map(([team, entries]) => {
            const section = document.createElement('div');
            section.style.margin = '8px 0';
            const heading = document.createElement('b');
            heading.textContent = team;
            section.appendChild(heading);
            entries.forEach(entry => {
                const line = document.createElement('div');
                line.textContent = `${entry.name} (${entry.category}): ${entry.word || '-'}`;
                section.appendChild(line);
            });
            return section;
        }));
    });
    socket.emit('getTeekesselchenOverview');

    window.startTeekesselchen = function() {
        const roundId = document.getElementById('teeRoundSelect').value;
        if (!roundId) return alert('Bitte eine Runde wählen!');
        socket.emit('adminStartTeekesselchenRound', { roundId });
    };
    window.releaseTeekesselchenWords = () => socket.emit('adminReleaseTeekesselchenWords');
    window.revealTeekesselchen = () => socket.emit('adminRevealTeekesselchen');

    window.onModuleStateUpdate = function(state) {
        const game = state.teekesselchenGame || {};
        const status = document.getElementById('teeAdminStatus');
        if (!status) return;

        const round = teeRounds.find(entry => entry.id === game.roundId);
        document.getElementById('teeAdminSolution').textContent = round ? round.answer : '-';
        status.textContent = {
            IDLE: 'Noch keine Runde aktiv.',
            WRITING: 'Spieler tragen ihre Wörter ein, Buzzer offen.',
            GUESSING: 'Wörter sind freigegeben, Buzzer offen.',
            REVEALED: 'Aufgelöst.'
        }[game.phase] || game.phase;
    };
</script>
