<style>
    .tee-game { text-align: center; }
    .tee-category {
        margin: 10px 0;
        padding: 12px;
        border-radius: 8px;
        background: #202a2b;
        font-weight: bold;
    }
    .tee-timer { font-size: 2rem; font-weight: bold; margin: 8px 0; }
    #teeText {
        width: 100%;
        min-height: 110px;
        box-sizing: border-box;
        padding: 12px;
        font: inherit;
        resize: vertical;
    }
    .tee-revealed { margin: 8px 0; padding: 10px; border: 1px solid #566078; border-radius: 7px; text-align: left; }
    .tee-answer { margin-top: 12px; font-size: 1.6rem; font-weight: bold; color: #2ed573; }
</style>

<div class="tee-game">
    <h2>Teekesselchen</h2>
    <p id="teeStatus">Warte auf die nächste Runde...</p>
    <div id="teeTimer" class="tee-timer"></div>
    <div id="teeCategory" class="tee-category" style="display:none;"></div>
    <textarea id="teeText" maxlength="200" placeholder="Beschreibe dein Wort, ohne es zu nennen..." style="display:none;"></textarea>
    <div id="teeRevealed"></div>
    <div id="teeAnswer" class="tee-answer"></div>
</div>

<script>
    let teeOwnCategory = '';

    socket.off('teekesselchenPlayerUpdate');
    socket.on('teekesselchenPlayerUpdate', view => {
        teeOwnCategory = view.category || '';
        const category = document.getElementById('teeCategory');
        const text = document.getElementById('teeText');
        if (!category || !text) return;
        category.style.display = teeOwnCategory ? 'block' : 'none';
        category.textContent = `Dein Teekesselchen ist: ${teeOwnCategory}`;
        if (document.activeElement !== text) text.value = view.ownText || '';
    });

    window.onModuleStateUpdate = function(state) {
        const game = state.teekesselchenGame || {};
        const text = document.getElementById('teeText');
        if (!text) return;

        const writing = game.phase === 'WRITING';
        text.style.display = game.phase === 'IDLE' || !teeOwnCategory ? 'none' : 'block';
        text.disabled = !writing;
        document.getElementById('teeTimer').textContent = writing ? `${game.timeRemaining}s` : '';
        document.getElementById('teeStatus').textContent = {
            IDLE: 'Warte auf die nächste Runde...',
            WRITING: 'Beschreibe dein Wort!',
            GUESSING: 'Jetzt wird geraten. Buzzer drücken, wenn du das Wort kennst!',
            REVEALED: 'Auflösung'
        }[game.phase] || '';

        const revealed = document.getElementById('teeRevealed');
        revealed.replaceChildren(...Object.entries(game.revealedTeams || {}).map(([team, info]) => {
            const box = document.createElement('div');
            box.className = 'tee-revealed';
            const heading = document.createElement('b');
            heading.textContent = `${team}: ${info.category}`;
            box.appendChild(heading);
            info.texts.forEach(entry => {
                const line = document.createElement('div');
                line.textContent = `${entry.name}: ${entry.text}`;
                box.appendChild(line);
            });
            return box;
        }));
        document.getElementById('teeAnswer').textContent = game.answer || '';
    };

    socket.emit('getTeekesselchenView');

    document.getElementById('teeText').addEventListener('input', event => {
        socket.emit('updateTeekesselchenText', event.target.value);
    });
</script>
